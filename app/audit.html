<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>অডিট ট্রেইল — AdalatAI</title>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="assets/icons/icon-192.png">
</head>
<body>
<div id="shell">
<main>
  <h1 data-i18n="audit_title">অডিট ট্রেইল — প্রতিটি এআই-কাজ ও বিচারকের সিদ্ধান্ত</h1>
  <p class="small">${"প্রতিটি এন্ট্রি: ঘটনা, মডেল সংস্করণ, সময় — পরিবর্তনযোগ্য নয় (append-only)"}</p>
  <button id="exportBtn" class="secondary"></button>
  <div id="trail"></div>
</main>
</div>
<script type="module">
import { initShell, el } from "./assets/js/app.js";
import { all } from "./assets/js/store.js";

initShell("audit");
const lang = settings.lang || "bn";
el("exportBtn").textContent = t("audit_export", lang);
const items = (await all("audit")).sort((a, b) => b.at.localeCompare(a.at));
el("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(items, null, 1)], { type: "application/json" });
  const a2 = document.createElement("a");
  a2.href = URL.createObjectURL(blob);
  a2.download = "adalatai-audit-trail.json"; a2.click();
};
el("trail").innerHTML = items.length ? items.map((a) => `
  <div class="card"><b>${a.event}</b> <span class="small">${a.at} · model: ${a.model_version}</span>
    <p class="small" style="white-space:pre-wrap">${a.detail}</p></div>`).join("")
  : `<p class="small">${t("audit_empty", lang)}</p>`;
</script>
</body>
</html>
