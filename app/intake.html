<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>মামলা গ্রহণ — AdalatAI</title>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="assets/icons/icon-192.png">
</head>
<body>
<div id="shell">
<main>
  <h1 data-i18n="intake_title">মামলা গ্রহণ ও এআই প্রি-বিশ্লেষণ</h1>
  <div class="card">
    <label data-i18n="facts_label">ঘটনার বিবরণ (বাংলা/English)</label>
    <textarea id="facts" rows="4"></textarea>
    <button class="secondary" id="voiceBtn" data-i18n="voice_start">🎤 বলুন</button>
    <span class="small" id="voiceNote"></span>
    <label data-i18n="examples_label">উদাহরণ মামলা (বাংলা ও ইংরেজি):</label>
    <div class="chips" id="exampleChips"></div>
    <br><button id="analyzeBtn" data-i18n="analyze">এআই বিশ্লেষণ চালান</button>
    <div id="analysis" style="margin-top:0.8rem"></div>
  </div>
  <p class="small" data-i18n="disclaimer"></p>
</main>
</div>
<script type="module">
import { initShell, el, audit } from "./assets/js/app.js";
import { analyzeCase } from "./assets/js/court.js";
import { add, settings } from "./assets/js/store.js";
import { t } from "./assets/js/i18n.js";
import { listen, speechSupported } from "./assets/js/voice.js";

initShell("intake");
const lang = settings.lang || "bn";

const EXAMPLES = [
  { bn: "রাতের বেলা দোকান ভেঙে টিভি চুরি হয়েছে", ro: "rate dokan bhenge TV churi hoyeche", en: "Shop broken into at night, TV stolen — theft", label: "চুরি / theft" },
  { bn: "রাস্তায় ছুরি দেখিয়ে চেইন ছিনতাই করেছে", ro: "rastay chhuri dekhiye chain chintai koreche", en: "Snatched a gold chain at knifepoint — robbery", label: "ছিনতাই / robbery" },
  { bn: "পাঁচ-ছয় জনের গ্যাং অস্ত্র নিয়ে বাড়ি লুট করেছে", ro: "pach-chhoy jon er gang ostro niye bari lut koreche", en: "Armed gang of five committed dacoity at a house", label: "দলবদ্ধ ডাকাতি / dacoity" },
  { bn: "ছুরি মেরে খুন করেছে, মৃতদেহ উদ্ধার", ro: "chhuri mere khun koreche, mrittodo uddhar", en: "Stabbed to death — murder, body recovered", label: "খুন / murder" },
  { bn: "লাঠি দিয়ে মারধর করে হাত ভেঙেছে", ro: "lathi diye mar-dhor kore hath bhengeche", en: "Beaten with sticks, arm broken — grievous hurt", label: "আঘাত / hurt" },
  { bn: "প্রতিদিন কলেজ পথে ছাত্রীকে অশ্লীল ইশারা করে ইভটিজিং করে", ro: "protidin college pothe chhatritoke oshlil ishara kore evtijging kore", en: "Eve-teasing a college student with indecent gestures daily", label: "ইভ-টিজিং / eve teasing" },
  { bn: "নারী নির্যাতন — রাস্তায় এক নারীকে জোর করে ধরে আক্রমণ", ro: "nari nirjaton — rastay ek narike jore kore dhore akromon", en: "Violence against a woman — assaulted on the street", label: "নারী নির্যাতন / violence vs women" },
  { bn: "স্ত্রীকে যৌতুকের জন্য মারধর করেছে", ro: "strike joutuker jonno mar-dhor koreche", en: "Torturing the wife demanding dowry", label: "যৌতুক / dowry" },
  { bn: "ধর্ষণের অভিযোগ উঠেছে", ro: "dhorshoner abhiyog utheche", en: "A rape complaint has been filed", label: "ধর্ষণ / rape" },
  { bn: "এসিড নিক্ষেপ করে পুড়িয়ে দিয়েছে", ro: "acid nikhep kore puriye diyeche", en: "Threw acid on the victim — acid violence", label: "এসিড / acid" },
  { bn: "স্কুল ফেরত শিশুকে অপহরণ করেছে", ro: "school ferot shishuke opohoron koreche", en: "Kidnapped a child on the way home from school", label: "অপহরণ / kidnapping" },
  { bn: "এক কক্ষে তিন দিন তালাবদ্ধ করে রেখেছে", ro: "ek kokhhe tin din talaboddho kore rekheche", en: "Locked a person in a room for 3 days — wrongful confinement", label: "অবৈধ আটক / confinement" },
  { bn: "ভুয়া চাকরির প্রতিশ্রুতি দিয়ে ২ লাখ টাকা নিয়েছে", ro: "bhua chakrir protishruti diye 2 lakh taka niyeche", en: "Took 200k taka with a false job promise — cheating", label: "প্রতারণা / cheating" },
  { bn: "কোম্পানির টাকা আত্মসাৎ করেছে", ro: "company er taka atomshot koreche", en: "Misappropriated company funds — breach of trust", label: "আস্থাভাজন / breach of trust" },
  { bn: "গাড়ির কাচ ভেঙে ক্ষতি করেছে", ro: "garir kach bhenge khoti koreche", en: "Broke the car windshield — mischief", label: "সম্পত্তি ক্ষতি / mischief" },
  { bn: "রাতে জমির ভেতরে অনধিকার প্রবেশ", ro: "rate jamir bhitore onodikar proboesh", en: "Criminal trespass into land at night", label: "অনধিকার / trespass" },
  { bn: "ফেসবুকে মিথ্যা পোস্ট করে মানহানি করেছে", ro: "facebook e bhua post kore manhani koreche", en: "Posted false statements defaming me on Facebook", label: "মানহানি / defamation" },
  { bn: "মেরে ফেলার হুমকি দিয়ে টাকা দাবি করেছে", ro: "mere felar humki diye taka dabi koreche", en: "Threatened to kill and demanded money", label: "ভয় প্রদর্শন / intimidation" },
  { bn: "অফিসে নারী কর্মীকে অশ্লীল প্রস্তাব দিয়ে হয়রানি করছে", ro: "office e nari kormike oshlil prostab diye hoyran korchhe", en: "Sexually harassing a female colleague at work", label: "যৌন হয়রানি / harassment" },
  { bn: "ব্যাংকের চেক ডিশনার হয়ে গেছে", ro: "banker chek dishonour hoye geche", en: "The cheque was dishonoured — §138 NI Act", label: "চেক ডিশনার / cheque bounce" },
  { bn: "ফেসবুকে ভুয়া আইডি খুলে টাকা হাতিয়ে নিয়েছে", ro: "facebook e bhua ID khule taka hatiye niyeche", en: "Fake Facebook ID used to defraud money — cyber fraud", label: "সাইবার প্রতারণা / cyber fraud" },
  { bn: "ইউটিউবে মানহানিকর ভিডিও আপলোড করেছে", ro: "youtube o manhanikor video upload koreche", en: "Uploaded defamatory videos on YouTube", label: "অনলাইন মানহানি / online defamation" },
  { bn: "ফেসবুক অ্যাকাউন্ট হ্যাক করেছে", ro: "facebook account hack koreche", en: "Hacked the Facebook account", label: "হ্যাকিং / hacking" },
  { bn: "ইয়াবা বিক্রির সময় ধরা পড়েছে", ro: "yaba bikrir somoy dhora poreche", en: "Caught selling yaba — narcotics", label: "মাদক / narcotics" },
  { bn: "সরকারি কাজে ঘুষ দাবি করেছে", ro: "sharkari kaje ghush dabi koreche", en: "A public servant demanded a bribe — corruption", label: "ঘুষ / bribery" },
  { bn: "বেপরোয়া গাড়ি চালিয়ে পথচারী নিহত হয়েছে", ro: "beproya gari chaliye pothchari nihoto hoyeche", en: "Rash driving killed a pedestrian — death by negligence", label: "দুর্ঘটনায় মৃত্যু / negligence" },
  { bn: "ব্যাংকের ঋণ পরিশোধ করছে না", ro: "banker rin porishodh korchhe na", en: "Defaulting on the bank loan — Artha Rin Adalat", label: "অর্থঋণ / loan default" },
  { bn: "স্ত্রী-সন্তানের ভরণপোষণ দিচ্ছে না", ro: "stri-shantaner bhoronposhon dicchhe na", en: "Not paying maintenance to wife and children", label: "ভরণপোষণ / maintenance" },
  { bn: "প্রতিবেশীর সঙ্গে জমির সীমানা বিরোধ", ro: "protibeshir shonghe simana birodh", en: "Land boundary dispute with a neighbour — Village Court", label: "গ্রাম আদালত / village dispute" },
  { bn: "ami ekti mamla korte chai — dokan theke mobile churi hoyeche", ro: "ami ekti mamla korte chai — dokan theke mobile churi hoyeche", en: "I want to file a case — mobile phone stolen from the shop", label: "বাংলিশ / Banglish theft" },
];
const chipBox = el("exampleChips");
EXAMPLES.forEach((ex, i) => {
  const b = document.createElement("button");
  b.className = "secondary"; b.style.margin = "0.15rem 0.3rem 0.15rem 0";
  b.textContent = (lang === "bn" ? "উদা: " : "Ex: ") + (i + 1) + " · " + ex.label;
  b.onclick = () => { el("facts").value = (lang === "bn" ? ex.bn : lang === "ro" ? ex.ro : ex.en) || ex.en; };
  chipBox.appendChild(b);
});
// Banglish quick-select (romanized input is a first-class citizen)
const roBtn = document.createElement("button");
roBtn.className = "secondary";
roBtn.textContent = lang === "bn" ? "⌨ বাংলিশ: ami ekti mamla korte chai" : "⌨ Banglish: ami ekti mamla korte chai";
roBtn.onclick = () => { el("facts").value = "ami ekti mamla korte chai — dokan theke mobile churi hoyeche"; };
chipBox.appendChild(roBtn);

// voice intake (progressive enhancement; tap input always works)
let rec = null;
const vb = el("voiceBtn");
if (!speechSupported()) { vb.disabled = true; el("voiceNote").textContent = t("voice_unsupported", lang); }
vb.onclick = () => {
  vb.disabled = true;
  vb.textContent = t("voice_stop", lang);
  listen({
    lang: lang === "bn" ? "bn-BD" : "en-US",
    onResult: (text) => { el("facts").value = (el("facts").value + " " + text).trim(); },
    onEnd: () => { vb.disabled = false; vb.textContent = t("voice_start", lang); },
  });
};

el("analyzeBtn").onclick = async () => {
  const facts = el("facts").value.trim();
  if (!facts) { alert(t("empty_facts", lang)); return; }
  el("analyzeBtn").disabled = true;
  el("analyzeBtn").textContent = t("analyzing", lang);
  const a = await analyzeCase(facts);
  const model = await (await fetch("data/case_model.json")).json();
  const glossary = await (await fetch("data/bn_explanations.json")).json();
  const penaltyRow = (s) => {
    const p = s.punishment;
    const parts = [];
    if (p.death) parts.push(lang === "bn" ? "মৃত্যুদণ্ড" : "death");
    if (p.life) parts.push(lang === "bn" ? "যাবজ্জীবন" : "imprisonment for life");
    if (p.maxYears) parts.push((lang === "bn" ? "সর্বোচ্চ " : "up to ") + p.maxYears + (lang === "bn" ? " বছর" : " yr"));
    if (p.fine) parts.push(lang === "bn" ? "জরিমানা" : "fine");
    return parts.join(" · ") || (p.notes[0] || "—");
  };
  el("analysis").innerHTML = `
    <div class="card"><b>${t("ai_types", lang)}</b>
      <div class="chips">${a.types.map(([ty, sc]) => `<span class="chip">${(t("labels", lang)[ty] || ty)} · ${sc}</span>`).join("") || "—"}</div></div>
    <div class="card"><b>${t("ai_sections", lang)}</b>
      ${a.sections.map((s) => `<div class="note"><b>${lang === "bn" ? "ধারা" : "Section"} ${s.number} — ${s.title}</b><br>
        <span class="small">${t("quote", lang)}:</span> <i>"${s.text}"</i><br>
        ${lang === "bn" && glossary.explanations[s.number] ? `<span class="small"><b>${t("bn_explain", lang)}:</b> ${glossary.explanations[s.number]}</span><br>` : ""}
        <span class="small">${t("penalty", lang)}: <b>${penaltyRow(s)}</b></span><br>
        <a class="small" href="${s.url}" target="_blank" rel="noopener">${s.url}</a></div>`).join("")}
    </div>
    <div class="card"><b>${t("ai_evidence", lang)}</b>
      <ul style="margin:0.3rem 0 0 1.1rem">${a.evidence.map((e) => `<li class="small">${e}</li>`).join("")}</ul>
      <div class="card"><b>${lang === "bn" ? "বাস্তব প্রিসিডেন্ট (প্রকৃত হাইকোর্ট রায় — নমুনা ব্যাচ)" : "Real precedents (actual High Court judgments — sample batch)"}</b>
      <div id="precedents" class="small">…</div></div>
      <br><button id="sendJudge">${t("save_case", lang)}</button></div>`;
  // real-precedent search (BM25-lite over real SC judgment excerpts)
  fetch("data/precedents_real.json").then((r) => r.json()).then((P) => {
    const qTokens = new Set(facts.toLowerCase().match(/[\wঀ-৿]+/g) || []);
    const scored = P.precedents.map((p) => {
      const toks = (p.excerpt.toLowerCase().match(/[\wঀ-৿]+/g) || []);
      let hits = 0;
      for (const t of qTokens) if (t.length > 3 && toks.includes(t)) hits++;
      return { p, hits };
    }).sort((a, b) => b.hits - a.hits).slice(0, 3);
    el("precedents").innerHTML = scored.filter((x) => x.hits > 0).map((x) =>
      `<div class="note small">⚖ ${x.p.title}<br><a href="${x.p.url}" target="_blank" rel="noopener">${lang === "bn" ? "সূত্র (PDF)" : "Source (PDF)"}</a> · ${x.p.pages} ${lang === "bn" ? "পৃষ্ঠা" : "pages"}</div>`).join("")
      || `<span class="small">— ${lang === "bn" ? "ওভারল্যাপিং প্রিসিডেন্ট নেই" : "no overlapping precedents"}</span>`;
  }).catch(() => {});
  el("sendJudge").onclick = async () => {
    const caseNo = "CC-" + new Date().toISOString().slice(0, 10).replace(/-/g, "") + "-" + Math.floor(Math.random() * 900 + 100);
    await add("cases", { caseNo, facts, analysis: a, status: "PENDING_JUDGE", createdAt: new Date().toISOString() });
    await audit("AI_ANALYSIS", { caseNo, types: a.types, sections: a.sections.map((s) => s.number), model_version: a.modelVersion });
    el("sendJudge").textContent = t("sent", lang) + " " + caseNo + ")";
  };
  el("analyzeBtn").disabled = false;
  el("analyzeBtn").textContent = t("analyze", lang);
};
</script>
</body>
</html>
